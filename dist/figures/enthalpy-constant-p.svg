<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" role="img" aria-label="일정한 압력에서 기체를 가열하면 넣은 열의 일부가 피스톤을 밀어 올리는 일로 나간다. 그 둘을 합친 것이 엔탈피 변화다.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    .ink { fill: #1c1b19; }
    .muted { fill: #6b6862; }
    .box { stroke: #c9c5bd; fill: none; }
    .wall { fill: #c9c5bd; }
    .gas { fill: #3c7fb1; }
    .hot { fill: #b4531f; }
    .hotS { stroke: #b4531f; fill: none; }
    .inkS { stroke: #1c1b19; fill: none; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eceaf0; }
      .muted { fill: #a3a0aa; }
      .box { stroke: #4a4852; }
      .wall { fill: #4a4852; }
      .gas { fill: #7fb4dd; }
      .hot { fill: #e8925c; }
      .hotS { stroke: #e8925c; }
      .inkS { stroke: #eceaf0; }
    }
  </style>
  <defs>
    <marker id="ea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>

  <!-- 가열 전 -->
  <g>
    <rect x="70" y="112" width="90" height="76" class="gas" opacity="0.25"/>
    <rect x="70" y="104" width="90" height="10" class="wall"/>
    <path d="M70,104 L70,188 M160,104 L160,188 M70,188 L160,188" class="box" stroke-width="2"/>
    <path d="M115,88 L115,66" class="inkS" stroke-width="1.6" marker-end="url(#ea)"/>
    <text x="115" y="58" class="muted" font-size="11" text-anchor="middle">일정한 압력 p</text>
    <text x="115" y="212" class="muted" font-size="12" text-anchor="middle">가열 전</text>
  </g>

  <path d="M190,150 L246,150" class="hotS" stroke-width="2" marker-end="url(#ea)"/>
  <text x="218" y="140" class="hot" font-size="13" font-weight="700" text-anchor="middle">Q</text>

  <!-- 가열 후 -->
  <g>
    <rect x="280" y="86" width="90" height="102" class="gas" opacity="0.35"/>
    <rect x="280" y="78" width="90" height="10" class="wall"/>
    <path d="M280,78 L280,188 M370,78 L370,188 M280,188 L370,188" class="box" stroke-width="2"/>
    <path d="M325,62 L325,40" class="hotS" stroke-width="1.8" marker-end="url(#ea)"/>
    <text x="336" y="54" class="hot" font-size="11">피스톤이 밀려 올라간다</text>
    <text x="325" y="212" class="muted" font-size="12" text-anchor="middle">가열 후</text>
  </g>

  <text x="240" y="238" class="ink" font-size="13" font-weight="700" text-anchor="middle">Q = ΔU + pΔV = ΔH</text>
</svg>
