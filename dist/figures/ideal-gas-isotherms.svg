<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 265" role="img" aria-label="이상기체의 등온선. 온도가 높을수록 곡선이 원점에서 멀어진다.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    .ink { fill: #1c1b19; }
    .muted { fill: #6b6862; }
    .axis { stroke: #c9c5bd; }
    .c1 { stroke: #1c1b19; fill: none; opacity: 0.35; }
    .c2 { stroke: #1c1b19; fill: none; opacity: 0.6; }
    .c3 { stroke: #b4531f; fill: none; }
    .acc { fill: #b4531f; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eceaf0; }
      .muted { fill: #a3a0aa; }
      .axis { stroke: #4a4852; }
      .c1 { stroke: #eceaf0; }
      .c2 { stroke: #eceaf0; }
      .c3 { stroke: #e8925c; }
      .acc { fill: #e8925c; }
    }
  </style>

  <line x1="70" y1="30" x2="70" y2="215" class="axis" stroke-width="1"/>
  <line x1="70" y1="215" x2="440" y2="215" class="axis" stroke-width="1"/>

  <path d="M100,155 C170,198 250,206 410,209" class="c1" stroke-width="2"/>
  <path d="M100,108 C180,170 265,192 410,200" class="c2" stroke-width="2"/>
  <path d="M100,62 C190,138 280,174 410,190" class="c3" stroke-width="2"/>

  <g class="muted" font-size="11">
    <text x="416" y="212">T₁</text>
    <text x="416" y="203">T₂</text>
  </g>
  <text x="416" y="193" class="acc" font-size="11" font-weight="700">T₃</text>

  <text x="255" y="256" class="muted" font-size="12" text-anchor="middle">V · 부피</text>
  <text x="26" y="26" class="ink" font-size="13" font-weight="700">p · 압력</text>
  <text x="255" y="42" class="muted" font-size="11" text-anchor="middle">pV = Nk<tspan font-size="9" dy="2">B</tspan><tspan dy="-2">T</tspan> · 온도가 높을수록 바깥쪽 곡선</text>
</svg>
