<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="갈바니 전지의 구조. 왼쪽은 산화가 일어나는 산화전극이 담긴 비커, 오른쪽은 환원이 일어나는 환원전극이 담긴 비커이며, 두 비커는 이온이 오가는 염다리로, 두 전극은 전자가 흐르는 외부 회로로 연결되어 있다.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    .ink { fill: #1c1b19; }
    .muted { fill: #6b6862; }
    .axis { stroke: #c9c5bd; }
    .beaker { fill: none; stroke: #6b6862; }
    .liquidA { fill: #3c7fb1; opacity: 0.18; }
    .liquidB { fill: #b4531f; opacity: 0.18; }
    .electrode { fill: none; stroke: #1c1b19; }
    .wire { stroke: #1c1b19; fill: none; }
    .acc { fill: #b4531f; }
    .accLine { stroke: #b4531f; }
    .blueFill { fill: #3c7fb1; }
    .blueLine { stroke: #3c7fb1; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eceaf0; }
      .muted { fill: #a3a0aa; }
      .axis { stroke: #4a4852; }
      .beaker { stroke: #a3a0aa; }
      .liquidA { fill: #7fb4dd; opacity: 0.22; }
      .liquidB { fill: #e8925c; opacity: 0.22; }
      .electrode { stroke: #eceaf0; }
      .wire { stroke: #eceaf0; }
      .acc { fill: #e8925c; }
      .accLine { stroke: #e8925c; }
      .blueFill { fill: #7fb4dd; }
      .blueLine { stroke: #7fb4dd; }
    }
  </style>

  <!-- Left beaker: oxidation electrode -->
  <path d="M50,150 L50,240 Q50,250 60,250 L150,250 Q160,250 160,240 L160,150" class="beaker" stroke-width="1.5"/>
  <rect x="52" y="190" width="106" height="58" class="liquidA"/>
  <rect x="95" y="90" width="10" height="130" class="electrode" stroke-width="1.6"/>
  <text x="100" y="270" class="ink" font-size="12" text-anchor="middle">산화전극 (−)</text>
  <text x="100" y="286" class="muted" font-size="10" text-anchor="middle">산화가 일어난다</text>

  <!-- Right beaker: reduction electrode -->
  <path d="M320,150 L320,240 Q320,250 330,250 L420,250 Q430,250 430,240 L430,150" class="beaker" stroke-width="1.5"/>
  <rect x="322" y="190" width="106" height="58" class="liquidB"/>
  <rect x="370" y="90" width="10" height="130" class="electrode" stroke-width="1.6"/>
  <text x="375" y="270" class="ink" font-size="12" text-anchor="middle">환원전극 (+)</text>
  <text x="375" y="286" class="muted" font-size="10" text-anchor="middle">환원이 일어난다</text>

  <!-- Salt bridge -->
  <path d="M160,150 C200,110 280,110 320,150" class="beaker" stroke-width="1.5" fill="none"/>
  <text x="240" y="105" class="muted" font-size="11" text-anchor="middle">염다리 (이온 이동)</text>

  <!-- External wire with electron flow -->
  <path d="M100,90 L100,50 L375,50 L375,90" class="wire" stroke-width="1.6" fill="none"/>
  <path d="M220,50 l14,-5 l0,10 z" class="acc"/>
  <text x="240" y="38" class="acc" font-size="12" font-weight="700" text-anchor="middle">전자 흐름 (e⁻)</text>

  <text x="240" y="20" class="ink" font-size="13" font-weight="700" text-anchor="middle">갈바니 전지</text>
</svg>
