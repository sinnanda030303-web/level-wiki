<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-label="르샤틀리에 원리 도표. 왼쪽 막대그래프는 초기 평형에서 반응물과 생성물의 농도를, 가운데 화살표는 반응물을 추가하는 스트레스를, 오른쪽 막대그래프는 정반응 쪽으로 이동해 도달한 새 평형에서 반응물이 줄고 생성물이 늘어난 모습을 보여준다.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    .ink { fill: #1c1b19; }
    .muted { fill: #6b6862; }
    .axis { stroke: #c9c5bd; }
    .barA { fill: #3c7fb1; }
    .barB { fill: #b4531f; }
    .acc { fill: #b4531f; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eceaf0; }
      .muted { fill: #a3a0aa; }
      .axis { stroke: #4a4852; }
      .barA { fill: #7fb4dd; }
      .barB { fill: #e8925c; }
      .acc { fill: #e8925c; }
    }
  </style>

  <!-- Before -->
  <text x="90" y="30" class="ink" font-size="13" font-weight="700" text-anchor="middle">처음 평형</text>
  <line x1="40" y1="220" x2="160" y2="220" class="axis" stroke-width="1"/>
  <rect x="55" y="140" width="30" height="80" class="barA"/>
  <rect x="105" y="170" width="30" height="50" class="barB"/>
  <text x="70" y="235" class="muted" font-size="10" text-anchor="middle">반응물</text>
  <text x="120" y="235" class="muted" font-size="10" text-anchor="middle">생성물</text>

  <!-- Stress arrow -->
  <line x1="180" y1="150" x2="270" y2="150" class="acc" stroke-width="2" marker-end="url(#lh)"/>
  <text x="225" y="135" class="acc" font-size="12" font-weight="700" text-anchor="middle">반응물 추가</text>
  <text x="225" y="170" class="muted" font-size="11" text-anchor="middle">(스트레스)</text>

  <defs>
    <marker id="lh" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" class="acc"/>
    </marker>
  </defs>

  <!-- After -->
  <text x="390" y="30" class="ink" font-size="13" font-weight="700" text-anchor="middle">새 평형</text>
  <line x1="340" y1="220" x2="460" y2="220" class="axis" stroke-width="1"/>
  <rect x="355" y="160" width="30" height="60" class="barA"/>
  <rect x="405" y="120" width="30" height="100" class="barB"/>
  <text x="370" y="235" class="muted" font-size="10" text-anchor="middle">반응물</text>
  <text x="420" y="235" class="muted" font-size="10" text-anchor="middle">생성물</text>

  <text x="240" y="265" class="muted" font-size="11" text-anchor="middle">추가한 반응물의 일부가 소모되며 생성물 쪽으로 평형이 이동한다</text>
</svg>
