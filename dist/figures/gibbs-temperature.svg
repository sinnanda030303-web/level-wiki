<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 265" role="img" aria-label="온도에 따른 깁스 자유에너지 변화. 직선이 0을 지나는 온도부터 반응이 자발적이 된다.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    .ink { fill: #1c1b19; }
    .muted { fill: #6b6862; }
    .axis { stroke: #c9c5bd; }
    .zero { stroke: #6b6862; }
    .lineG { stroke: #1c1b19; fill: none; }
    .fill { fill: #b4531f; }
    .acc { fill: #b4531f; }
    .dash { stroke: #b4531f; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eceaf0; }
      .muted { fill: #a3a0aa; }
      .axis { stroke: #4a4852; }
      .zero { stroke: #a3a0aa; }
      .lineG { stroke: #eceaf0; }
      .fill { fill: #e8925c; }
      .acc { fill: #e8925c; }
      .dash { stroke: #e8925c; }
    }
  </style>

  <path d="M251,140 L420,140 L420,215 L251,215 Z" class="fill" opacity="0.14"/>

  <line x1="70" y1="35" x2="70" y2="222" class="axis" stroke-width="1"/>
  <line x1="70" y1="140" x2="435" y2="140" class="zero" stroke-width="1" stroke-dasharray="5 4"/>

  <path d="M80,62 L420,213" class="lineG" stroke-width="2.2"/>

  <line x1="251" y1="140" x2="251" y2="222" class="dash" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="251" cy="140" r="4" class="acc"/>

  <text x="86" y="52" class="muted" font-size="11">ΔH</text>
  <text x="150" y="92" class="muted" font-size="11">기울기 = −ΔS</text>

  <text x="46" y="145" class="muted" font-size="12">0</text>
  <text x="340" y="178" class="acc" font-size="13" font-weight="700" text-anchor="middle">자발적</text>
  <text x="340" y="196" class="muted" font-size="11" text-anchor="middle">ΔG &lt; 0</text>
  <text x="150" y="178" class="muted" font-size="11" text-anchor="middle">일어나지 않음</text>

  <text x="251" y="240" class="acc" font-size="11" text-anchor="middle">T = ΔH / ΔS</text>
  <text x="255" y="258" class="muted" font-size="11" text-anchor="middle">ΔH &gt; 0, ΔS &gt; 0 인 경우 · T · 온도</text>
  <text x="26" y="30" class="ink" font-size="13" font-weight="700">ΔG</text>
</svg>
