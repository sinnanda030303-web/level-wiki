<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-label="양전하와 음전하 한 쌍이 만드는 전기력선. 선은 양전하에서 나와 음전하로 들어가며, 화살표가 전기장의 방향을 나타낸다.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    .ink { fill: #1c1b19; }
    .muted { fill: #6b6862; }
    .axis { stroke: #c9c5bd; }
    .line { stroke: #1c1b19; fill: none; }
    .acc { fill: #b4531f; stroke: #b4531f; }
    .acc-line { stroke: #b4531f; }
    .blue { fill: #3c7fb1; stroke: #3c7fb1; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eceaf0; }
      .muted { fill: #a3a0aa; }
      .axis { stroke: #4a4852; }
      .line { stroke: #eceaf0; }
      .acc { fill: #e8925c; stroke: #e8925c; }
      .acc-line { stroke: #e8925c; }
      .blue { fill: #7fb4dd; stroke: #7fb4dd; }
    }
  </style>

  <!-- field lines from + (left, x=160) to - (right, x=320), y center 150 -->
  <path d="M160,150 C210,150 230,150 300,90 M160,150 C200,120 260,90 300,90" class="line" stroke-width="1.3"/>
  <path d="M160,150 C230,110 260,100 300,120" class="line" stroke-width="1.3"/>
  <path d="M160,120 C230,90 280,90 320,150" class="line" stroke-width="1.3"/>
  <path d="M160,180 C230,210 280,210 320,150" class="line" stroke-width="1.3"/>
  <path d="M160,150 C230,190 260,200 300,180" class="line" stroke-width="1.3"/>
  <path d="M160,150 C210,150 230,150 300,210 M160,150 C200,180 260,210 300,210" class="line" stroke-width="1.3"/>
  <path d="M140,150 C120,90 150,50 200,40 C260,30 300,60 300,90" class="line" stroke-width="1.1"/>
  <path d="M140,150 C120,210 150,250 200,260 C260,270 300,240 300,210" class="line" stroke-width="1.1"/>

  <!-- arrowheads along a couple of lines -->
  <path d="M232,120 l10,-4 l-2,10 z" class="line" stroke="none" fill-opacity="0.85"/>
  <path d="M232,180 l10,4 l-2,-10 z" class="line" stroke="none" fill-opacity="0.85"/>
  <path d="M260,95 l9,-6 l1,10 z" class="line" stroke="none" fill-opacity="0.85"/>

  <circle cx="160" cy="150" r="14" class="acc" fill-opacity="0.15" stroke-width="2"/>
  <text x="160" y="156" class="acc" font-size="16" font-weight="700" text-anchor="middle" stroke="none">+</text>

  <circle cx="320" cy="150" r="14" class="blue" fill-opacity="0.15" stroke-width="2"/>
  <text x="320" y="156" class="blue" font-size="16" font-weight="700" text-anchor="middle" stroke="none">−</text>

  <text x="160" y="185" class="muted" font-size="11" text-anchor="middle">양전하</text>
  <text x="320" y="185" class="muted" font-size="11" text-anchor="middle">음전하</text>

  <text x="240" y="30" class="ink" font-size="13" font-weight="700" text-anchor="middle">전기력선</text>
  <text x="240" y="266" class="muted" font-size="11" text-anchor="middle">선은 +에서 나와 −로 들어가고, 밀도가 장의 세기를 나타낸다</text>
</svg>
