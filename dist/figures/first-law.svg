<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 230" role="img" aria-label="열역학 제1법칙 도식. 계가 받은 열 Q와 받은 일 W의 합이 내부에너지 변화가 된다.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    .ink { fill: #1c1b19; }
    .muted { fill: #6b6862; }
    .box { stroke: #c9c5bd; fill: none; }
    .acc { fill: #b4531f; }
    .accS { stroke: #b4531f; fill: none; }
    .surface { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eceaf0; }
      .muted { fill: #a3a0aa; }
      .box { stroke: #4a4852; }
      .acc { fill: #e8925c; }
      .accS { stroke: #e8925c; }
      .surface { fill: #1e1d23; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>

  <rect x="165" y="55" width="185" height="115" rx="10" class="surface"/>
  <rect x="165" y="55" width="185" height="115" rx="10" class="box" stroke-width="1.5"/>

  <text x="257" y="92" class="muted" font-size="12" text-anchor="middle">계</text>
  <text x="257" y="126" class="ink" font-size="19" font-weight="700" text-anchor="middle">ΔU = Q + W</text>

  <path d="M58,90 L158,90" class="accS" stroke-width="2" marker-end="url(#a1)"/>
  <text x="60" y="80" class="acc" font-size="13" font-weight="700">Q</text>
  <text x="82" y="80" class="muted" font-size="11">받은 열</text>

  <path d="M58,140 L158,140" class="accS" stroke-width="2" marker-end="url(#a1)"/>
  <text x="60" y="130" class="acc" font-size="13" font-weight="700">W</text>
  <text x="82" y="130" class="muted" font-size="11">받은 일</text>

  <text x="257" y="200" class="muted" font-size="11" text-anchor="middle">계가 내놓는 쪽이면 부호가 음수가 된다.</text>
  <text x="257" y="217" class="muted" font-size="11" text-anchor="middle">Q와 W는 경로에 따라 달라지지만, 그 합은 언제나 같다.</text>
</svg>
