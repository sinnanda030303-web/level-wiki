<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="오비탈 채움 순서 도표. 에너지가 낮은 1s부터 2s, 2p 순서로 준위가 올라가며, 각 오비탈 칸에 화살표로 전자가 위아래로 반대 스핀으로 채워진다. 2p처럼 오비탈이 여러 개인 준위는 훈트 규칙에 따라 먼저 하나씩 채운 뒤 짝을 짓는다.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    .ink { fill: #1c1b19; }
    .muted { fill: #6b6862; }
    .axis { stroke: #c9c5bd; }
    .box { stroke: #c9c5bd; fill: none; }
    .arrow { stroke: #b4531f; fill: none; }
    .acc { fill: #b4531f; }
    .level { stroke: #4a4852; stroke-dasharray: 2 3; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eceaf0; }
      .muted { fill: #a3a0aa; }
      .axis { stroke: #4a4852; }
      .box { stroke: #4a4852; }
      .arrow { stroke: #e8925c; }
      .acc { fill: #e8925c; }
      .level { stroke: #6b6862; }
    }
  </style>

  <line x1="50" y1="20" x2="50" y2="260" class="axis" stroke-width="1"/>
  <text x="30" y="18" class="muted" font-size="11" text-anchor="middle">E</text>
  <path d="M46,24 L54,24 L50,14 Z" class="acc"/>

  <!-- 1s level -->
  <line x1="60" y1="240" x2="140" y2="240" class="level" stroke-width="1"/>
  <text x="150" y="244" class="ink" font-size="13">1s</text>
  <rect x="65" y="225" width="30" height="30" class="box" stroke-width="1.5"/>
  <line x1="76" y1="248" x2="76" y2="232" class="arrow" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="84" y1="232" x2="84" y2="248" class="arrow" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- 2s level -->
  <line x1="60" y1="170" x2="140" y2="170" class="level" stroke-width="1"/>
  <text x="150" y="174" class="ink" font-size="13">2s</text>
  <rect x="65" y="155" width="30" height="30" class="box" stroke-width="1.5"/>
  <line x1="76" y1="178" x2="76" y2="162" class="arrow" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="84" y1="162" x2="84" y2="178" class="arrow" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- 2p level: three orbitals, Hund's rule (each singly filled first) -->
  <line x1="220" y1="110" x2="420" y2="110" class="level" stroke-width="1"/>
  <text x="430" y="114" class="ink" font-size="13">2p</text>
  <rect x="225" y="95" width="30" height="30" class="box" stroke-width="1.5"/>
  <rect x="265" y="95" width="30" height="30" class="box" stroke-width="1.5"/>
  <rect x="305" y="95" width="30" height="30" class="box" stroke-width="1.5"/>
  <line x1="236" y1="118" x2="236" y2="102" class="arrow" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="276" y1="118" x2="276" y2="102" class="arrow" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="316" y1="118" x2="316" y2="102" class="arrow" stroke-width="1.6" marker-end="url(#ah)"/>

  <defs>
    <marker id="ah" markerWidth="6" markerHeight="6" refX="3" refY="5" orient="auto">
      <path d="M0,5 L3,0 L6,5 Z" class="acc"/>
    </marker>
  </defs>

  <path d="M100,240 C160,235 180,180 210,175" class="axis" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
  <path d="M100,170 C170,160 190,120 215,112" class="axis" stroke-width="1" fill="none" stroke-dasharray="3 3"/>

  <text x="270" y="60" class="acc" font-size="12" font-weight="700" text-anchor="middle">훈트 규칙</text>
  <text x="270" y="76" class="muted" font-size="11" text-anchor="middle">같은 에너지의 오비탈엔 먼저 하나씩</text>

  <text x="240" y="285" class="muted" font-size="11" text-anchor="middle">에너지 낮은 준위부터 채워진다 (쌓음원리)</text>
</svg>
