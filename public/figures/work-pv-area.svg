<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 265" role="img" aria-label="압력-부피 그래프. 곡선 아래의 넓이가 기체가 한 일에 해당한다.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    .ink { fill: #1c1b19; }
    .muted { fill: #6b6862; }
    .axis { stroke: #c9c5bd; }
    .curve { stroke: #1c1b19; fill: none; }
    .fill { fill: #b4531f; }
    .acc { fill: #b4531f; }
    .dash { stroke: #c9c5bd; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eceaf0; }
      .muted { fill: #a3a0aa; }
      .axis { stroke: #4a4852; }
      .curve { stroke: #eceaf0; }
      .fill { fill: #e8925c; }
      .acc { fill: #e8925c; }
      .dash { stroke: #4a4852; }
    }
  </style>

  <path d="M110,70 C190,130 270,165 400,180 L400,215 L110,215 Z" class="fill" opacity="0.2"/>
  <path d="M110,70 C190,130 270,165 400,180" class="curve" stroke-width="2"/>

  <line x1="70" y1="35" x2="70" y2="215" class="axis" stroke-width="1"/>
  <line x1="70" y1="215" x2="430" y2="215" class="axis" stroke-width="1"/>

  <line x1="110" y1="70" x2="110" y2="215" class="dash" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="400" y1="180" x2="400" y2="215" class="dash" stroke-width="1" stroke-dasharray="4 3"/>

  <text x="255" y="172" class="acc" font-size="16" font-weight="700" text-anchor="middle">W = ∫ p dV</text>

  <text x="110" y="234" class="muted" font-size="12" text-anchor="middle">V₁</text>
  <text x="400" y="234" class="muted" font-size="12" text-anchor="middle">V₂</text>
  <text x="255" y="256" class="muted" font-size="12" text-anchor="middle">V · 부피</text>
  <text x="26" y="30" class="ink" font-size="13" font-weight="700">p · 압력</text>
</svg>
