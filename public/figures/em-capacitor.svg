<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-label="평행판 축전기 구조. 위쪽 판은 양전하, 아래쪽 판은 음전하로 대전되어 있고, 두 판 사이에 균일한 전기장이 아래 방향으로 형성된다.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    .ink { fill: #1c1b19; }
    .muted { fill: #6b6862; }
    .plate { fill: #1c1b19; }
    .acc { fill: #b4531f; stroke: #b4531f; }
    .acc-line { stroke: #b4531f; }
    .blue { fill: #3c7fb1; stroke: #3c7fb1; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eceaf0; }
      .muted { fill: #a3a0aa; }
      .plate { fill: #eceaf0; }
      .acc { fill: #e8925c; stroke: #e8925c; }
      .acc-line { stroke: #e8925c; }
      .blue { fill: #7fb4dd; stroke: #7fb4dd; }
    }
  </style>

  <!-- top plate (+) -->
  <rect x="110" y="70" width="260" height="12" class="plate"/>
  <!-- bottom plate (-) -->
  <rect x="110" y="198" width="260" height="12" class="plate"/>

  <!-- plus charges on top plate -->
  <g class="acc" font-size="13" font-weight="700" text-anchor="middle" stroke="none">
    <text x="140" y="65">+</text><text x="180" y="65">+</text><text x="220" y="65">+</text>
    <text x="260" y="65">+</text><text x="300" y="65">+</text><text x="340" y="65">+</text>
  </g>
  <!-- minus charges on bottom plate -->
  <g class="blue" font-size="13" font-weight="700" text-anchor="middle" stroke="none">
    <text x="140" y="228">−</text><text x="180" y="228">−</text><text x="220" y="228">−</text>
    <text x="260" y="228">−</text><text x="300" y="228">−</text><text x="340" y="228">−</text>
  </g>

  <!-- uniform field lines between plates -->
  <g class="acc-line" stroke-width="1.4">
    <line x1="140" y1="86" x2="140" y2="194"/>
    <line x1="180" y1="86" x2="180" y2="194"/>
    <line x1="220" y1="86" x2="220" y2="194"/>
    <line x1="260" y1="86" x2="260" y2="194"/>
    <line x1="300" y1="86" x2="300" y2="194"/>
    <line x1="340" y1="86" x2="340" y2="194"/>
  </g>
  <g class="acc" stroke="none">
    <path d="M140,178 l-5,-10 l10,0 z"/>
    <path d="M180,178 l-5,-10 l10,0 z"/>
    <path d="M220,178 l-5,-10 l10,0 z"/>
    <path d="M260,178 l-5,-10 l10,0 z"/>
    <path d="M300,178 l-5,-10 l10,0 z"/>
    <path d="M340,178 l-5,-10 l10,0 z"/>
  </g>

  <!-- dimension: d -->
  <line x1="95" y1="82" x2="95" y2="198" class="muted" stroke-width="1"/>
  <line x1="90" y1="82" x2="100" y2="82" class="muted" stroke-width="1"/>
  <line x1="90" y1="198" x2="100" y2="198" class="muted" stroke-width="1"/>
  <text x="80" y="144" class="muted" font-size="12" text-anchor="middle">d</text>

  <text x="240" y="45" class="ink" font-size="13" font-weight="700" text-anchor="middle">E = σ / ε₀,  C = ε₀A / d</text>
  <text x="240" y="252" class="muted" font-size="11" text-anchor="middle">두 판 사이 전기장은 균일하며, 간격 d와 넓이 A로 전기용량이 정해진다</text>
</svg>
