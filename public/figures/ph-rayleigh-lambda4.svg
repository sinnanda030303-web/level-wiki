<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 285" role="img" aria-label="파장에 따른 세 곡선 비교. 산란 효율 1/람다의 네제곱 곡선은 짧은 파장 쪽으로 끝없이 치솟지만, 햇빛 스펙트럼을 곱한 실제 하늘빛의 세기는 420나노미터 부근에서 정점을 찍고 꺾여 내려온다. 사람 눈의 밝기 감도는 555나노미터에서 최대이고 보라 영역에서는 거의 0이다.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    .ink { fill: #1c1b19; }
    .muted { fill: #6b6862; }
    .axis { stroke: #c9c5bd; }
    .r4 { stroke: #6b6862; fill: none; }
    .sky { stroke: #3c7fb1; fill: none; }
    .eye { fill: #b4531f; opacity: 0.16; }
    .eyeline { stroke: #b4531f; fill: none; opacity: 0.65; }
    .acc { fill: #b4531f; }
    .blue { fill: #3c7fb1; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eceaf0; }
      .muted { fill: #a3a0aa; }
      .axis { stroke: #4a4852; }
      .r4 { stroke: #a3a0aa; }
      .sky { stroke: #7fb4dd; }
      .eye { fill: #e8925c; opacity: 0.18; }
      .eyeline { stroke: #e8925c; }
      .acc { fill: #e8925c; }
      .blue { fill: #7fb4dd; }
    }
  </style>

  <line x1="60" y1="22" x2="60" y2="215" class="axis" stroke-width="1"/>
  <line x1="60" y1="215" x2="450" y2="215" class="axis" stroke-width="1"/>

  <!-- 눈의 밝기 감도 V(lambda) : 채워진 영역 -->
  <polygon class="eye" points="60,215 79,214.9 98,214.4 126.5,208.9 145.5,200.4 174,163.3 221.5,55.8 226,55 269,114 316.5,197.9 364,214.3 440,215 440,215 60,215"/>
  <polyline class="eyeline" stroke-width="1.2" stroke-dasharray="3 3" points="60,215 79,214.9 98,214.4 126.5,208.9 145.5,200.4 174,163.3 221.5,55.8 226,55 269,114 316.5,197.9 364,214.3 440,215"/>

  <!-- 1/lambda^4 : 산란 효율 -->
  <polyline class="r4" stroke-width="1.8" stroke-dasharray="6 4" points="60,28.8 79,63.3 98,90.2 126.5,120.4 155,141.9 174,152.9 221.5,172.6 269,185.1 316.5,193.6 364,198.8 440,204.5"/>

  <!-- 햇빛 스펙트럼 x 산란 효율 : 실제 하늘빛 -->
  <polyline class="sky" stroke-width="2.4" points="60,77.2 79,55 98,61.2 126.5,79.8 145.5,100.1 174,130.2 221.5,159.2 269,176.9 316.5,190.7 364,198.8 440,206.5"/>

  <!-- 정점 표시 -->
  <circle cx="79" cy="55" r="3.5" class="blue"/>
  <line x1="79" y1="55" x2="79" y2="215" class="axis" stroke-width="0.8" stroke-dasharray="2 3"/>

  <!-- 눈금 -->
  <g class="muted" font-size="10" text-anchor="middle">
    <text x="79" y="229">400</text>
    <text x="174" y="229">500</text>
    <text x="269" y="229">600</text>
    <text x="364" y="229">700 nm</text>
  </g>

  <!-- 라벨 -->
  <text x="112" y="30" class="muted" font-size="11">산란 효율 ∝ 1/λ⁴</text>
  <text x="112" y="43" class="muted" font-size="10">(계속 치솟는다)</text>

  <text x="150" y="72" class="blue" font-size="11" font-weight="700">실제 하늘빛의 세기</text>
  <text x="150" y="85" class="muted" font-size="10">= 햇빛 스펙트럼 × 산란 효율</text>

  <text x="250" y="46" class="acc" font-size="11" font-weight="700">사람 눈의 밝기 감도</text>
  <text x="250" y="59" class="muted" font-size="10">400 nm에서는 거의 0</text>

  <text x="30" y="16" class="ink" font-size="12" font-weight="700">상대 세기</text>
  <text x="245" y="252" class="muted" font-size="11" text-anchor="middle">보라 영역에는 흩어질 햇빛도 적고, 그것을 받아 적을 눈도 없다</text>
  <text x="245" y="268" class="muted" font-size="10" text-anchor="middle">세 곡선은 700 nm에서 겹치도록 맞춰 그렸다</text>
</svg>
