<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 265" role="img" aria-label="이중슬릿 실험 개요도. 두 슬릿에서 퍼져나간 원형 파면이 겹쳐 스크린에 밝고 어두운 줄무늬(간섭무늬)를 만든다. 슬릿을 하나만 열면 이 무늬는 사라지고 뭉툭한 봉우리 하나만 남는다.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    .ink { fill: #1c1b19; }
    .muted { fill: #6b6862; }
    .axis { stroke: #c9c5bd; }
    .wave { stroke: #1c1b19; fill: none; opacity: 0.55; }
    .wave2 { stroke: #3c7fb1; fill: none; opacity: 0.55; }
    .barrier { fill: #c9c5bd; }
    .pattern { fill: #b4531f; }
    .acc { fill: #b4531f; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eceaf0; }
      .muted { fill: #a3a0aa; }
      .axis { stroke: #4a4852; }
      .wave { stroke: #eceaf0; opacity: 0.5; }
      .wave2 { stroke: #7fb4dd; opacity: 0.5; }
      .barrier { fill: #4a4852; }
      .pattern { fill: #e8925c; }
      .acc { fill: #e8925c; }
    }
  </style>

  <!-- source -->
  <circle cx="30" cy="132" r="4" class="pattern"/>
  <text x="30" y="118" class="muted" font-size="10" text-anchor="middle">전자원</text>

  <!-- barrier with two slits -->
  <rect x="150" y="20" width="8" height="45" class="barrier"/>
  <rect x="150" y="112" width="8" height="42" class="barrier"/>
  <rect x="150" y="197" width="8" height="45" class="barrier"/>
  <text x="154" y="14" class="muted" font-size="10" text-anchor="middle">슬릿</text>

  <!-- circular wavefronts from slit A (y=88) -->
  <circle cx="154" cy="88" r="30" class="wave" stroke-width="1"/>
  <circle cx="154" cy="88" r="55" class="wave" stroke-width="1"/>
  <circle cx="154" cy="88" r="80" class="wave" stroke-width="1"/>
  <circle cx="154" cy="88" r="105" class="wave" stroke-width="1"/>
  <circle cx="154" cy="88" r="130" class="wave" stroke-width="1"/>

  <!-- circular wavefronts from slit B (y=176) -->
  <circle cx="154" cy="176" r="30" class="wave2" stroke-width="1"/>
  <circle cx="154" cy="176" r="55" class="wave2" stroke-width="1"/>
  <circle cx="154" cy="176" r="80" class="wave2" stroke-width="1"/>
  <circle cx="154" cy="176" r="105" class="wave2" stroke-width="1"/>
  <circle cx="154" cy="176" r="130" class="wave2" stroke-width="1"/>

  <!-- screen -->
  <line x1="380" y1="18" x2="380" y2="246" class="axis" stroke-width="1.5"/>
  <text x="380" y="258" class="muted" font-size="10" text-anchor="middle">스크린</text>

  <!-- interference pattern bars -->
  <g class="pattern">
    <rect x="384" y="26" width="26" height="6" opacity="0.15"/>
    <rect x="384" y="40" width="40" height="8" opacity="0.9"/>
    <rect x="384" y="56" width="16" height="6" opacity="0.15"/>
    <rect x="384" y="70" width="48" height="10" opacity="0.9"/>
    <rect x="384" y="88" width="12" height="6" opacity="0.15"/>
    <rect x="384" y="102" width="56" height="14" opacity="0.95"/>
    <rect x="384" y="124" width="10" height="6" opacity="0.15"/>
    <rect x="384" y="138" width="56" height="14" opacity="0.95"/>
    <rect x="384" y="160" width="12" height="6" opacity="0.15"/>
    <rect x="384" y="174" width="48" height="10" opacity="0.9"/>
    <rect x="384" y="192" width="16" height="6" opacity="0.15"/>
    <rect x="384" y="206" width="40" height="8" opacity="0.9"/>
    <rect x="384" y="222" width="26" height="6" opacity="0.15"/>
  </g>

  <text x="450" y="112" class="acc" font-size="12" font-weight="700" text-anchor="middle">밝음</text>
  <text x="450" y="128" class="muted" font-size="10" text-anchor="middle">(보강간섭)</text>
  <text x="240" y="255" class="muted" font-size="11" text-anchor="middle">전자를 한 번에 하나씩 보내도 무늬는 그대로 쌓인다</text>
</svg>
