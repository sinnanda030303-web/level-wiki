<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-label="두 공의 정면 충돌 전후 운동량 비교. 충돌 전에는 왼쪽 공만 오른쪽으로 움직이고 오른쪽 공은 정지해 있다. 충돌 후에는 왼쪽 공이 멈추고 오른쪽 공이 처음과 같은 크기의 운동량으로 움직인다.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    .ink { fill: #1c1b19; }
    .muted { fill: #6b6862; }
    .axis { stroke: #c9c5bd; }
    .ballA { fill: #3c7fb1; }
    .ballB { fill: #c9c5bd; }
    .vec { stroke: #b4531f; fill: #b4531f; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eceaf0; }
      .muted { fill: #a3a0aa; }
      .axis { stroke: #4a4852; }
      .ballA { fill: #7fb4dd; }
      .ballB { fill: #4a4852; }
      .vec { stroke: #e8925c; fill: #e8925c; }
    }
  </style>

  <text x="20" y="26" class="ink" font-size="14" font-weight="700">충돌 전</text>
  <line x1="20" y1="70" x2="460" y2="70" class="axis" stroke-width="1"/>
  <circle cx="90" cy="70" r="18" class="ballA"/>
  <circle cx="300" cy="70" r="18" class="ballB"/>
  <line x1="112" y1="70" x2="185" y2="70" class="vec" stroke-width="3"/>
  <polygon points="185,64 199,70 185,76" class="vec"/>
  <text x="150" y="55" class="vec" font-size="13" font-weight="700" text-anchor="middle">p</text>
  <text x="90" y="105" class="muted" font-size="12" text-anchor="middle">A (움직임)</text>
  <text x="300" y="105" class="muted" font-size="12" text-anchor="middle">B (정지)</text>

  <text x="20" y="150" class="ink" font-size="14" font-weight="700">충돌 후</text>
  <line x1="20" y1="194" x2="460" y2="194" class="axis" stroke-width="1"/>
  <circle cx="90" cy="194" r="18" class="ballA"/>
  <circle cx="300" cy="194" r="18" class="ballB"/>
  <line x1="322" y1="194" x2="395" y2="194" class="vec" stroke-width="3"/>
  <polygon points="395,188 409,194 395,200" class="vec"/>
  <text x="360" y="179" class="vec" font-size="13" font-weight="700" text-anchor="middle">p</text>
  <text x="90" y="229" class="muted" font-size="12" text-anchor="middle">A (정지)</text>
  <text x="300" y="229" class="muted" font-size="12" text-anchor="middle">B (움직임)</text>
</svg>
