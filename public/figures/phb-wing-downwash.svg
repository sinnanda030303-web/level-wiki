<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-label="받음각을 가진 날개를 지난 공기 흐름이 아래로 꺾여 내려가고, 그 반작용으로 날개가 위로 밀려 올라가는 그림. 위쪽 면의 굽은 유선은 압력이 낮음을 함께 나타낸다.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    .ink { fill: #1c1b19; }
    .muted { fill: #6b6862; }
    .acc { fill: #b4531f; }
    .blue { fill: #3c7fb1; }
    .foil { fill: #c9c5bd; stroke: #1c1b19; }
    .stream { stroke: #3c7fb1; fill: none; }
    .lift { stroke: #b4531f; fill: none; }
    .liftfill { fill: #b4531f; }
    .down { stroke: #6b6862; fill: none; }
    .downfill { fill: #6b6862; }
    .axis { stroke: #c9c5bd; fill: none; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eceaf0; }
      .muted { fill: #a3a0aa; }
      .acc { fill: #e8925c; }
      .blue { fill: #7fb4dd; }
      .foil { fill: #4a4852; stroke: #eceaf0; }
      .stream { stroke: #7fb4dd; }
      .lift { stroke: #e8925c; }
      .liftfill { fill: #e8925c; }
      .down { stroke: #a3a0aa; }
      .downfill { fill: #a3a0aa; }
      .axis { stroke: #4a4852; }
    }
  </style>

  <text x="20" y="24" class="ink" font-size="13" font-weight="700">날개는 공기를 아래로 밀어냅니다</text>

  <!-- 유선 -->
  <g class="stream" stroke-width="1.8">
    <path d="M24,62 C120,58 176,52 232,66 C300,84 366,104 456,116"/>
    <path d="M24,92 C118,88 172,76 226,92 C296,112 368,134 456,146"/>
    <path d="M24,150 C120,150 176,150 230,152 C300,156 368,166 456,176"/>
    <path d="M24,178 C120,178 178,178 234,180 C304,183 368,190 456,198"/>
  </g>
  <g class="stream" stroke-width="1.6" fill="none">
    <path d="M456,116 L446,111 M456,116 L446,122"/>
    <path d="M456,146 L446,141 M456,146 L446,152"/>
    <path d="M456,176 L446,171 M456,176 L446,182"/>
    <path d="M456,198 L446,193 M456,198 L446,204"/>
  </g>

  <!-- 날개 -->
  <path d="M118,132 C144,104 194,100 246,124 C192,136 146,140 118,132 Z" class="foil" stroke-width="1.8"/>

  <!-- 받음각 -->
  <line x1="96" y1="132" x2="270" y2="132" class="axis" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="112" y1="136" x2="252" y2="118" class="axis" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M156,132 A 46 46 0 0 0 154,126" class="lift" stroke-width="1.4" fill="none"/>
  <text x="150" y="152" class="acc" font-size="12" font-weight="700">α · 받음각</text>

  <!-- 양력 화살표 -->
  <line x1="186" y1="112" x2="186" y2="52" class="lift" stroke-width="2.6"/>
  <path d="M186,44 L180,58 L192,58 Z" class="liftfill"/>
  <text x="196" y="46" class="acc" font-size="12.5" font-weight="700">양력</text>

  <!-- 다운워시 화살표 -->
  <line x1="360" y1="146" x2="360" y2="212" class="down" stroke-width="2.4"/>
  <path d="M360,220 L354,206 L366,206 Z" class="downfill"/>
  <text x="370" y="204" class="muted" font-size="12" font-weight="700">다운워시</text>

  <text x="240" y="244" class="ink" font-size="11.5" text-anchor="middle">아래로 내려간 공기의 운동량만큼, 반작용이 날개를 위로 밀어 올립니다.</text>
  <text x="240" y="262" class="muted" font-size="11" text-anchor="middle">위쪽 면에서 유선이 아래로 굽는다는 것은 그쪽 압력이 낮다는 말과 같습니다.</text>
</svg>
