<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" role="img" aria-label="원운동하는 물체의 속도 벡터와 구심력 벡터. 속도 벡터는 궤도에 접하는 방향을, 구심력 벡터는 항상 원의 중심을 향하는 방향을 가리킨다.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    .ink { fill: #1c1b19; }
    .muted { fill: #6b6862; }
    .orbit { stroke: #c9c5bd; fill: none; }
    .center { fill: #6b6862; }
    .vvec { stroke: #3c7fb1; fill: #3c7fb1; }
    .fvec { stroke: #b4531f; fill: #b4531f; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eceaf0; }
      .muted { fill: #a3a0aa; }
      .orbit { stroke: #4a4852; }
      .center { fill: #a3a0aa; }
      .vvec { stroke: #7fb4dd; fill: #7fb4dd; }
      .fvec { stroke: #e8925c; fill: #e8925c; }
    }
  </style>

  <circle cx="210" cy="165" r="110" class="orbit" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="210" cy="165" r="3" class="center"/>
  <text x="220" y="160" class="muted" font-size="12">중심</text>

  <!-- object at top of circle -->
  <circle cx="210" cy="55" r="9" class="fvec" fill-opacity="0.85"/>

  <!-- centripetal force vector toward center -->
  <line x1="210" y1="55" x2="210" y2="115" class="fvec" stroke-width="3"/>
  <polygon points="204,115 210,129 216,115" class="fvec"/>
  <text x="228" y="95" class="fvec" font-size="13" font-weight="700">F (구심력)</text>

  <!-- velocity vector tangent (horizontal at top point) -->
  <line x1="222" y1="55" x2="290" y2="55" class="vvec" stroke-width="3"/>
  <polygon points="290,49 304,55 290,61" class="vvec"/>
  <text x="300" y="40" class="vvec" font-size="13" font-weight="700">v</text>

  <text x="210" y="300" class="ink" font-size="13" text-anchor="middle">속도는 궤도에 접하고, 힘은 항상 중심을 향한다</text>
</svg>
