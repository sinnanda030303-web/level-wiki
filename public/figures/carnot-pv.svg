<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 275" role="img" aria-label="카르노 순환의 압력-부피 그래프. 등온 팽창, 단열 팽창, 등온 압축, 단열 압축의 네 과정이 닫힌 고리를 이룬다.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    .ink { fill: #1c1b19; }
    .muted { fill: #6b6862; }
    .axis { stroke: #c9c5bd; }
    .iso { stroke: #b4531f; fill: none; }
    .adi { stroke: #3c7fb1; fill: none; }
    .loop { fill: #b4531f; }
    .acc { fill: #b4531f; }
    .cool { fill: #3c7fb1; }
    .dot { fill: #1c1b19; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eceaf0; }
      .muted { fill: #a3a0aa; }
      .axis { stroke: #4a4852; }
      .iso { stroke: #e8925c; }
      .adi { stroke: #7fb4dd; }
      .loop { fill: #e8925c; }
      .acc { fill: #e8925c; }
      .cool { fill: #7fb4dd; }
      .dot { fill: #eceaf0; }
    }
  </style>
  <defs>
    <marker id="ca" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>

  <path d="M110,70 Q172,96 230,105 Q290,132 340,175 Q272,166 200,140 Q148,112 110,70 Z" class="loop" opacity="0.14"/>

  <line x1="70" y1="30" x2="70" y2="222" class="axis" stroke-width="1"/>
  <line x1="70" y1="222" x2="440" y2="222" class="axis" stroke-width="1"/>

  <path d="M110,70 Q172,96 230,105" class="iso" stroke-width="2.2" marker-end="url(#ca)"/>
  <path d="M230,105 Q290,132 340,175" class="adi" stroke-width="2.2" marker-end="url(#ca)"/>
  <path d="M340,175 Q272,166 200,140" class="iso" stroke-width="2.2" marker-end="url(#ca)"/>
  <path d="M200,140 Q148,112 110,70" class="adi" stroke-width="2.2" marker-end="url(#ca)"/>

  <g class="dot">
    <circle cx="110" cy="70" r="3.5"/>
    <circle cx="230" cy="105" r="3.5"/>
    <circle cx="340" cy="175" r="3.5"/>
    <circle cx="200" cy="140" r="3.5"/>
  </g>

  <g class="ink" font-size="12" font-weight="700">
    <text x="96" y="62">A</text>
    <text x="236" y="98">B</text>
    <text x="348" y="182">C</text>
    <text x="186" y="136">D</text>
  </g>

  <text x="150" y="52" class="acc" font-size="11">등온 팽창 · T<tspan font-size="9" dy="2">h</tspan></text>
  <text x="300" y="128" class="cool" font-size="11">단열 팽창</text>
  <text x="252" y="192" class="acc" font-size="11">등온 압축 · T<tspan font-size="9" dy="2">c</tspan></text>
  <text x="96" y="128" class="cool" font-size="11">단열 압축</text>

  <text x="255" y="248" class="muted" font-size="12" text-anchor="middle">V · 부피</text>
  <text x="26" y="26" class="ink" font-size="13" font-weight="700">p · 압력</text>
  <text x="255" y="266" class="muted" font-size="11" text-anchor="middle">고리로 둘러싸인 넓이가 한 순환에서 얻는 일이다</text>
</svg>
