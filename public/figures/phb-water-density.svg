<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="온도에 따른 물의 밀도 곡선. 섭씨 4도 부근에서 최대가 되고 그 아래에서는 오히려 밀도가 줄어든다. 축을 끊은 아래쪽에 얼음의 밀도 약 917이 훨씬 낮은 값으로 표시되어 있다.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    .ink { fill: #1c1b19; }
    .muted { fill: #6b6862; }
    .acc { fill: #b4531f; }
    .axis { stroke: #c9c5bd; fill: none; }
    .curve { stroke: #3c7fb1; fill: none; }
    .mark { stroke: #b4531f; fill: none; }
    .dot { fill: #b4531f; }
    .icebar { stroke: #6b6862; fill: none; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eceaf0; }
      .muted { fill: #a3a0aa; }
      .acc { fill: #e8925c; }
      .axis { stroke: #4a4852; }
      .curve { stroke: #7fb4dd; }
      .mark { stroke: #e8925c; }
      .dot { fill: #e8925c; }
      .icebar { stroke: #a3a0aa; }
    }
  </style>

  <text x="20" y="24" class="ink" font-size="13" font-weight="700">밀도 (kg/m³)</text>

  <line x1="70" y1="36" x2="70" y2="192" class="axis" stroke-width="1"/>
  <line x1="70" y1="192" x2="450" y2="192" class="axis" stroke-width="1"/>

  <g class="muted" font-size="11" text-anchor="end">
    <text x="64" y="52">1000</text>
    <text x="64" y="81">999</text>
    <text x="64" y="109">998</text>
    <text x="64" y="137">997</text>
    <text x="64" y="166">996</text>
  </g>

  <polyline points="93,53 116,50 139,49 163,50 186,53 208,57 267,74 324,99 382,132 439,172" class="curve" stroke-width="2.2"/>

  <line x1="139" y1="49" x2="139" y2="192" class="mark" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="139" cy="49" r="4" class="dot"/>
  <text x="150" y="44" class="acc" font-size="12" font-weight="700">3.98 °C · 밀도 최대</text>
  <text x="150" y="60" class="muted" font-size="11">999.97 kg/m³</text>

  <line x1="93" y1="53" x2="93" y2="192" class="axis" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="88" y="112" class="muted" font-size="11" text-anchor="end" transform="rotate(-90 88 112)">0 °C 액체</text>

  <path d="M100,75 L118,60" class="mark" stroke-width="1.2"/>
  <text x="86" y="86" class="muted" font-size="10.5">여기서는</text>
  <text x="86" y="99" class="muted" font-size="10.5">데우면 무거워집니다</text>

  <g class="muted" font-size="11" text-anchor="middle">
    <text x="93" y="209">0</text>
    <text x="208" y="209">10</text>
    <text x="324" y="209">20</text>
    <text x="439" y="209">30</text>
    <text x="266" y="226">온도 (°C)</text>
  </g>

  <!-- 축 끊김 -->
  <g class="axis" stroke-width="1.4">
    <line x1="62" y1="242" x2="78" y2="236"/>
    <line x1="62" y1="250" x2="78" y2="244"/>
  </g>

  <line x1="70" y1="268" x2="450" y2="268" class="icebar" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="76" y="262" class="ink" font-size="12" font-weight="700">얼음 Ih · 약 917 kg/m³</text>
  <text x="76" y="288" class="muted" font-size="11">얼자마자 8% 넘게 뚝 떨어집니다. 그래서 뜹니다.</text>
</svg>
