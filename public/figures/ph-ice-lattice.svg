<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 285" role="img" aria-label="물 분자에서 육각형까지 이어지는 세 단계. 왼쪽은 결합각 104.5도의 굽은 물 분자와 두 개의 비공유 전자쌍. 가운데는 그 분자가 이웃 넷과 거의 정사면체로 수소결합을 맺는 모습. 오른쪽은 그렇게 이어진 그물이 기저면에서 여섯 개짜리 고리를 이루는 육방정 얼음 구조.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    .ink { fill: #1c1b19; }
    .muted { fill: #6b6862; }
    .axis { stroke: #c9c5bd; }
    .ox { fill: #3c7fb1; }
    .hy { fill: #c9c5bd; stroke: #6b6862; }
    .bond { stroke: #1c1b19; fill: none; }
    .hb { stroke: #b4531f; fill: none; }
    .lone { fill: #b4531f; opacity: 0.22; }
    .acc { fill: #b4531f; }
    .blue { fill: #3c7fb1; }
    .arrow { stroke: #6b6862; fill: none; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eceaf0; }
      .muted { fill: #a3a0aa; }
      .axis { stroke: #4a4852; }
      .ox { fill: #7fb4dd; }
      .hy { fill: #4a4852; stroke: #a3a0aa; }
      .bond { stroke: #eceaf0; }
      .hb { stroke: #e8925c; }
      .lone { fill: #e8925c; opacity: 0.26; }
      .acc { fill: #e8925c; }
      .blue { fill: #7fb4dd; }
      .arrow { stroke: #a3a0aa; }
    }
  </style>

  <!-- ── ① 물 분자 ── -->
  <text x="78" y="30" class="ink" font-size="12" font-weight="700" text-anchor="middle">① 굽은 물 분자</text>
  <ellipse cx="78" cy="88" rx="26" ry="17" class="lone"/>
  <line x1="78" y1="120" x2="46" y2="150" class="bond" stroke-width="2"/>
  <line x1="78" y1="120" x2="110" y2="150" class="bond" stroke-width="2"/>
  <circle cx="78" cy="120" r="15" class="ox"/>
  <circle cx="46" cy="150" r="9" class="hy" stroke-width="1.2"/>
  <circle cx="110" cy="150" r="9" class="hy" stroke-width="1.2"/>
  <text x="78" y="125" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">O</text>
  <text x="46" y="154" class="ink" font-size="9" text-anchor="middle">H</text>
  <text x="110" y="154" class="ink" font-size="9" text-anchor="middle">H</text>
  <path class="hb" stroke-width="1.2" fill="none" d="M63,134 A21,21 0 0 0 93,134"/>
  <text x="78" y="150" class="acc" font-size="10" font-weight="700" text-anchor="middle">104.5°</text>
  <text x="78" y="80" class="muted" font-size="9" text-anchor="middle">비공유 전자쌍 2개</text>
  <text x="78" y="178" class="muted" font-size="10" text-anchor="middle">수소 2개는 내주고</text>
  <text x="78" y="191" class="muted" font-size="10" text-anchor="middle">전자쌍 2개는 받는다</text>

  <path class="arrow" stroke-width="1.2" d="M126,120 L156,120"/>
  <polygon class="muted" points="162,120 153,116 153,124"/>

  <!-- ── ② 정사면체 배위 ── -->
  <text x="240" y="30" class="ink" font-size="12" font-weight="700" text-anchor="middle">② 이웃 넷과 수소결합</text>
  <line x1="240" y1="110" x2="240" y2="62" class="hb" stroke-width="1.8" stroke-dasharray="4 3"/>
  <line x1="240" y1="110" x2="196" y2="140" class="hb" stroke-width="1.8" stroke-dasharray="4 3"/>
  <line x1="240" y1="110" x2="284" y2="140" class="hb" stroke-width="1.8" stroke-dasharray="4 3"/>
  <line x1="240" y1="110" x2="248" y2="158" class="hb" stroke-width="1.8" stroke-dasharray="4 3"/>
  <circle cx="240" cy="62" r="11" class="ox"/>
  <circle cx="196" cy="140" r="11" class="ox"/>
  <circle cx="284" cy="140" r="11" class="ox"/>
  <circle cx="248" cy="158" r="11" class="ox"/>
  <circle cx="240" cy="110" r="14" class="ox"/>
  <text x="240" y="115" font-size="10" font-weight="700" text-anchor="middle" fill="#ffffff">O</text>
  <text x="240" y="182" class="muted" font-size="10" text-anchor="middle">결합각이 정사면체각(109.5°)에</text>
  <text x="240" y="195" class="muted" font-size="10" text-anchor="middle">가까워 그물이 3차원으로 뻗는다</text>

  <path class="arrow" stroke-width="1.2" d="M304,120 L334,120"/>
  <polygon class="muted" points="340,120 331,116 331,124"/>

  <!-- ── ③ 육각 고리 ── -->
  <text x="404" y="30" class="ink" font-size="12" font-weight="700" text-anchor="middle">③ 기저면의 육각 고리</text>
  <polygon points="404,66 442,88 442,132 404,154 366,132 366,88" class="hb" stroke-width="2" fill="none"/>
  <circle cx="404" cy="66" r="8" class="ox"/>
  <circle cx="442" cy="88" r="8" class="ox"/>
  <circle cx="442" cy="132" r="8" class="ox"/>
  <circle cx="404" cy="154" r="8" class="ox"/>
  <circle cx="366" cy="132" r="8" class="ox"/>
  <circle cx="366" cy="88" r="8" class="ox"/>
  <circle cx="385" cy="77" r="4" class="hy" stroke-width="1"/>
  <circle cx="423" cy="77" r="4" class="hy" stroke-width="1"/>
  <circle cx="442" cy="110" r="4" class="hy" stroke-width="1"/>
  <circle cx="423" cy="143" r="4" class="hy" stroke-width="1"/>
  <circle cx="385" cy="143" r="4" class="hy" stroke-width="1"/>
  <circle cx="366" cy="110" r="4" class="hy" stroke-width="1"/>
  <text x="404" y="182" class="muted" font-size="10" text-anchor="middle">육방정 얼음 Ih</text>
  <text x="404" y="195" class="muted" font-size="10" text-anchor="middle">6회 대칭이 여기서 나온다</text>

  <line x1="40" y1="214" x2="440" y2="214" class="axis" stroke-width="1"/>
  <text x="240" y="238" class="ink" font-size="11" font-weight="700" text-anchor="middle">눈 결정의 육각형은 새로 생긴 모양이 아니라, 분자 배열의 대칭이 눈에 보일 만큼 커진 것이다</text>
  <text x="240" y="258" class="muted" font-size="10" text-anchor="middle">O–O 거리는 약 0.276 nm. 수소 위치는 &lt;얼음 규칙&gt;을 지키면서도 무질서하게 흩어져 있다</text>
  <text x="240" y="274" class="muted" font-size="10" text-anchor="middle">그 무질서가 얼음에 0 K에서도 사라지지 않는 잔류 엔트로피 3.4 J/(mol·K)를 남긴다</text>
</svg>
