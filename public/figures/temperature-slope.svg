<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 265" role="img" aria-label="내부에너지 U에 대한 엔트로피 S 곡선. 기울기가 1/T 이며, 왼쪽의 가파른 곳이 낮은 온도, 오른쪽의 완만한 곳이 높은 온도에 해당한다.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    .ink { fill: #1c1b19; }
    .muted { fill: #6b6862; }
    .axis { stroke: #c9c5bd; }
    .curve { stroke: #1c1b19; fill: none; }
    .tan { stroke: #b4531f; fill: none; }
    .dot { fill: #b4531f; }
    .acc { fill: #b4531f; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eceaf0; }
      .muted { fill: #a3a0aa; }
      .axis { stroke: #4a4852; }
      .curve { stroke: #eceaf0; }
      .tan { stroke: #e8925c; }
      .dot { fill: #e8925c; }
      .acc { fill: #e8925c; }
    }
  </style>

  <line x1="60" y1="30" x2="60" y2="215" class="axis" stroke-width="1"/>
  <line x1="60" y1="215" x2="450" y2="215" class="axis" stroke-width="1"/>

  <path d="M70,200 C160,95 250,62 430,45" class="curve" stroke-width="2"/>

  <line x1="84" y1="176" x2="194" y2="92" class="tan" stroke-width="1.5" stroke-dasharray="5 3"/>
  <circle cx="139" cy="134" r="3.5" class="dot"/>

  <line x1="277" y1="68" x2="387" y2="48" class="tan" stroke-width="1.5" stroke-dasharray="5 3"/>
  <circle cx="332" cy="58" r="3.5" class="dot"/>

  <text x="96" y="76" class="acc" font-size="12" font-weight="700">기울기 큼</text>
  <text x="96" y="92" class="muted" font-size="11">→ T 낮음</text>

  <text x="300" y="112" class="acc" font-size="12" font-weight="700">기울기 작음</text>
  <text x="300" y="128" class="muted" font-size="11">→ T 높음</text>

  <text x="245" y="240" class="muted" font-size="12" text-anchor="middle">U · 내부에너지</text>
  <text x="24" y="26" class="ink" font-size="13" font-weight="700">S · 엔트로피</text>
  <text x="245" y="257" class="muted" font-size="11" text-anchor="middle">곡선의 기울기가 1/T 이다</text>
</svg>
