<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 285" role="img" aria-label="액체 물의 유전 손실 곡선을 주파수에 대해 그린 그래프. 손실 최대는 약 17기가헤르츠에 있고, 전자레인지가 쓰는 2.45기가헤르츠는 그 봉우리가 아니라 낮은 주파수 쪽 기슭에 놓여 있다.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    .ink { fill: #1c1b19; }
    .muted { fill: #6b6862; }
    .acc { fill: #b4531f; }
    .blue { fill: #3c7fb1; }
    .axis { stroke: #c9c5bd; fill: none; }
    .curve { stroke: #3c7fb1; fill: none; }
    .mark { stroke: #b4531f; fill: none; }
    .dot { fill: #b4531f; }
    .peak { stroke: #6b6862; fill: none; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eceaf0; }
      .muted { fill: #a3a0aa; }
      .acc { fill: #e8925c; }
      .blue { fill: #7fb4dd; }
      .axis { stroke: #4a4852; }
      .curve { stroke: #7fb4dd; }
      .mark { stroke: #e8925c; }
      .dot { fill: #e8925c; }
      .peak { stroke: #a3a0aa; }
    }
  </style>

  <text x="20" y="24" class="ink" font-size="13" font-weight="700">ε″ · 유전 손실 (20 °C 물)</text>

  <line x1="60" y1="36" x2="60" y2="200" class="axis" stroke-width="1"/>
  <line x1="60" y1="200" x2="452" y2="200" class="axis" stroke-width="1"/>

  <polyline points="60,199 108,195 155,185 192,163 203,153 250,86 272,70 298,92 345,157 393,186 440,196" class="curve" stroke-width="2.2"/>

  <line x1="272" y1="70" x2="272" y2="200" class="peak" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="286" y="62" class="muted" font-size="11.5" font-weight="700">실제 손실 최대</text>
  <text x="286" y="77" class="muted" font-size="11">약 17 GHz (드바이 완화)</text>

  <line x1="192" y1="163" x2="192" y2="200" class="mark" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="192" cy="163" r="4.5" class="dot"/>
  <text x="118" y="140" class="acc" font-size="12" font-weight="700">2.45 GHz</text>
  <text x="118" y="155" class="acc" font-size="11">전자레인지</text>

  <g class="muted" font-size="10.5" text-anchor="middle">
    <text x="60" y="217">100 MHz</text>
    <text x="155" y="217">1 GHz</text>
    <text x="250" y="217">10 GHz</text>
    <text x="345" y="217">100 GHz</text>
    <text x="440" y="217">1 THz</text>
  </g>
  <text x="256" y="235" class="muted" font-size="11" text-anchor="middle">주파수 (로그 눈금)</text>

  <text x="240" y="258" class="ink" font-size="11.5" text-anchor="middle">전자레인지는 봉우리가 아니라 언덕의 기슭에 서 있습니다.</text>
  <text x="240" y="274" class="muted" font-size="11" text-anchor="middle">봉우리에 올라섰다면 겉만 타고 속은 차가웠을 것입니다.</text>
</svg>
