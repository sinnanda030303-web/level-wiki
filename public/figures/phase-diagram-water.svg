<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" role="img" aria-label="물의 상평형도. 융해 곡선이 왼쪽으로 기울어 있어 압력을 올리면 녹는점이 내려간다.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    .ink { fill: #1c1b19; }
    .muted { fill: #6b6862; }
    .axis { stroke: #c9c5bd; }
    .bound { stroke: #1c1b19; fill: none; }
    .acc { fill: #b4531f; }
    .accS { stroke: #b4531f; fill: none; }
    .rSolid { fill: #3c7fb1; }
    .rLiquid { fill: #3c7fb1; }
    .rGas { fill: #b4531f; }
    .dot { fill: #b4531f; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eceaf0; }
      .muted { fill: #a3a0aa; }
      .axis { stroke: #4a4852; }
      .bound { stroke: #eceaf0; }
      .acc { fill: #e8925c; }
      .accS { stroke: #e8925c; }
      .rSolid { fill: #7fb4dd; }
      .rLiquid { fill: #7fb4dd; }
      .rGas { fill: #e8925c; }
      .dot { fill: #e8925c; }
    }
  </style>

  <path d="M70,40 L128,40 L150,150 L70,150 Z" class="rSolid" opacity="0.12"/>
  <path d="M128,40 L400,40 L400,68 L370,70 Q260,88 150,150 Z" class="rLiquid" opacity="0.2"/>
  <path d="M70,150 L150,150 Q260,88 370,70 L400,68 L400,240 L70,240 Z" class="rGas" opacity="0.1"/>

  <line x1="70" y1="30" x2="70" y2="240" class="axis" stroke-width="1"/>
  <line x1="70" y1="240" x2="440" y2="240" class="axis" stroke-width="1"/>

  <!-- 융해 곡선: 왼쪽으로 기운다 -->
  <path d="M150,150 L128,40" class="bound" stroke-width="2"/>
  <!-- 기화 곡선 -->
  <path d="M150,150 Q260,88 370,70" class="bound" stroke-width="2"/>
  <!-- 승화 곡선 -->
  <path d="M150,150 Q110,196 74,232" class="bound" stroke-width="2"/>

  <circle cx="150" cy="150" r="4.5" class="dot"/>
  <circle cx="370" cy="70" r="4.5" class="dot"/>

  <g class="ink" font-size="13" font-weight="700">
    <text x="92" y="96">고체</text>
    <text x="250" y="66">액체</text>
    <text x="300" y="200">기체</text>
  </g>

  <text x="160" y="168" class="acc" font-size="11">삼중점</text>
  <text x="330" y="60" class="acc" font-size="11">임계점</text>

  <text x="255" y="264" class="muted" font-size="12" text-anchor="middle">T · 온도</text>
  <text x="26" y="26" class="ink" font-size="13" font-weight="700">p · 압력</text>
  <text x="255" y="282" class="muted" font-size="11" text-anchor="middle">융해 곡선이 왼쪽으로 기운 것이 물의 특이한 점이다</text>
</svg>
