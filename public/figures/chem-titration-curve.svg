<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-label="산-염기 적정 곡선. 가로축은 첨가한 염기의 부피, 세로축은 pH이다. 처음에는 pH가 완만하게 오르다가 당량점 부근에서 급격히 치솟은 뒤 다시 완만해진다.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    .ink { fill: #1c1b19; }
    .muted { fill: #6b6862; }
    .axis { stroke: #c9c5bd; }
    .curve { stroke: #1c1b19; fill: none; }
    .dot { fill: #b4531f; }
    .acc { fill: #b4531f; }
    .accLine { stroke: #b4531f; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eceaf0; }
      .muted { fill: #a3a0aa; }
      .axis { stroke: #4a4852; }
      .curve { stroke: #eceaf0; }
      .dot { fill: #e8925c; }
      .acc { fill: #e8925c; }
      .accLine { stroke: #e8925c; }
    }
  </style>

  <line x1="60" y1="30" x2="60" y2="230" class="axis" stroke-width="1"/>
  <line x1="60" y1="230" x2="440" y2="230" class="axis" stroke-width="1"/>

  <path d="M70,205 C160,195 200,185 225,150 C245,120 250,70 255,45 C280,42 340,40 420,38"
        class="curve" stroke-width="2"/>

  <line x1="240" y1="30" x2="240" y2="230" class="accLine" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="240" cy="98" r="3.5" class="dot"/>
  <text x="248" y="94" class="acc" font-size="11" font-weight="700">당량점</text>

  <text x="250" y="255" class="muted" font-size="12" text-anchor="middle">첨가한 염기의 부피</text>
  <text x="28" y="26" class="ink" font-size="13" font-weight="700">pH</text>
  <text x="45" y="234" class="muted" font-size="10" text-anchor="end">0</text>
  <text x="45" y="45" class="muted" font-size="10" text-anchor="end">14</text>
  <text x="45" y="140" class="muted" font-size="10" text-anchor="end">7</text>
  <line x1="55" y1="136" x2="65" y2="136" class="axis" stroke-width="1"/>

  <text x="250" y="270" class="muted" font-size="11" text-anchor="middle">당량점 부근에서 pH가 급격히 변한다</text>
</svg>
