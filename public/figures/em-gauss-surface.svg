<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-label="점전하를 둘러싼 상상의 구면(가우스 곡면)과 사방으로 뻗어나가는 전기력선. 곡면을 뚫고 나가는 선의 총량은 곡면의 모양이나 크기와 무관하게 안에 든 전하량으로만 정해진다." >
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    .ink { fill: #1c1b19; }
    .muted { fill: #6b6862; }
    .line { stroke: #1c1b19; fill: none; }
    .surface { stroke: #3c7fb1; fill: #3c7fb1; fill-opacity: 0.08; }
    .acc { fill: #b4531f; stroke: #b4531f; }
    .dot { fill: #b4531f; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eceaf0; }
      .muted { fill: #a3a0aa; }
      .line { stroke: #eceaf0; }
      .surface { stroke: #7fb4dd; fill: #7fb4dd; fill-opacity: 0.10; }
      .acc { fill: #e8925c; stroke: #e8925c; }
      .dot { fill: #e8925c; }
    }
  </style>

  <ellipse cx="240" cy="150" rx="110" ry="90" class="surface" stroke-width="1.6" stroke-dasharray="6 4"/>

  <!-- radial field lines, 12 directions -->
  <g class="line" stroke-width="1.3">
    <line x1="240" y1="150" x2="240" y2="30"/>
    <line x1="240" y1="150" x2="300" y2="45"/>
    <line x1="240" y1="150" x2="345" y2="90"/>
    <line x1="240" y1="150" x2="365" y2="150"/>
    <line x1="240" y1="150" x2="345" y2="210"/>
    <line x1="240" y1="150" x2="300" y2="255"/>
    <line x1="240" y1="150" x2="240" y2="270"/>
    <line x1="240" y1="150" x2="180" y2="255"/>
    <line x1="240" y1="150" x2="135" y2="210"/>
    <line x1="240" y1="150" x2="115" y2="150"/>
    <line x1="240" y1="150" x2="135" y2="90"/>
    <line x1="240" y1="150" x2="180" y2="45"/>
  </g>

  <!-- arrowheads at the ellipse boundary -->
  <g fill-opacity="0.9" stroke="none" class="line">
    <path d="M240,72 l-5,10 l10,0 z"/>
    <path d="M291,64 l-3,11 l9,-4 z"/>
    <path d="M328,101 l-8,8 l11,3 z"/>
    <path d="M340,150 l-9,5 l9,5 z" transform="translate(0,-10)"/>
  </g>

  <circle cx="240" cy="150" r="10" class="dot"/>
  <text x="240" y="154" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">q</text>

  <text x="240" y="255" class="muted" font-size="11" text-anchor="middle">가우스 곡면 (상상의 구면)</text>
  <text x="240" y="24" class="ink" font-size="13" font-weight="700" text-anchor="middle">전기선속 = q / ε₀</text>
</svg>
