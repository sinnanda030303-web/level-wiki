<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" role="img" aria-label="입자 4개를 두 칸에 나누는 경우의 수를 보여주는 막대그래프. 좌우로 고르게 나뉜 배치가 6가지로 가장 많다.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    .ink { fill: #1c1b19; }
    .muted { fill: #6b6862; }
    .axis { stroke: #c9c5bd; }
    .bar { fill: #b4531f; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eceaf0; }
      .muted { fill: #a3a0aa; }
      .axis { stroke: #4a4852; }
      .bar { fill: #e8925c; }
    }
  </style>

  <text x="24" y="28" class="ink" font-size="14" font-weight="700">입자 4개를 두 칸에 나누는 방법</text>

  <line x1="52" y1="200" x2="496" y2="200" class="axis" stroke-width="1"/>

  <g class="bar">
    <rect x="79" y="182" width="46" height="18" opacity="0.45"/>
    <rect x="163" y="128" width="46" height="72" opacity="0.45"/>
    <rect x="247" y="92" width="46" height="108"/>
    <rect x="331" y="128" width="46" height="72" opacity="0.45"/>
    <rect x="415" y="182" width="46" height="18" opacity="0.45"/>
  </g>

  <g class="ink" font-size="13" font-weight="700" text-anchor="middle">
    <text x="102" y="174">1</text>
    <text x="186" y="120">4</text>
    <text x="270" y="84">6</text>
    <text x="354" y="120">4</text>
    <text x="438" y="174">1</text>
  </g>

  <g class="muted" font-size="12" text-anchor="middle">
    <text x="102" y="220">0개</text>
    <text x="186" y="220">1개</text>
    <text x="270" y="220">2개</text>
    <text x="354" y="220">3개</text>
    <text x="438" y="220">4개</text>
  </g>

  <text x="270" y="241" class="muted" font-size="11" text-anchor="middle">왼쪽 칸에 있는 입자 수 (거시상태)</text>
  <text x="24" y="60" class="muted" font-size="11">미시상태 수 W</text>
</svg>
