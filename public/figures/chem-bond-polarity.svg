<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img" aria-label="전기음성도 차이에 따른 결합의 연속선. 왼쪽은 두 원자가 전자를 똑같이 나눠 갖는 대칭 공유결합, 가운데는 전자가 한쪽으로 치우친 극성 공유결합, 오른쪽은 전자가 완전히 넘어간 이온결합이다.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    .ink { fill: #1c1b19; }
    .muted { fill: #6b6862; }
    .axis { stroke: #c9c5bd; }
    .atomA { fill: none; stroke: #1c1b19; }
    .atomB { fill: none; stroke: #3c7fb1; }
    .cloud { fill: #b4531f; opacity: 0.28; }
    .acc { fill: #b4531f; }
    .blueFill { fill: #3c7fb1; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eceaf0; }
      .muted { fill: #a3a0aa; }
      .axis { stroke: #4a4852; }
      .atomA { stroke: #eceaf0; }
      .atomB { stroke: #7fb4dd; }
      .cloud { fill: #e8925c; opacity: 0.3; }
      .acc { fill: #e8925c; }
      .blueFill { fill: #7fb4dd; }
    }
  </style>

  <line x1="30" y1="220" x2="450" y2="220" class="axis" stroke-width="1"/>
  <text x="240" y="245" class="muted" font-size="11" text-anchor="middle">전기음성도 차이 →</text>

  <!-- Case 1: nonpolar covalent -->
  <ellipse cx="80" cy="120" rx="42" ry="26" class="cloud"/>
  <circle cx="62" cy="120" r="14" class="atomA" stroke-width="1.6"/>
  <circle cx="98" cy="120" r="14" class="atomB" stroke-width="1.6"/>
  <text x="80" y="170" class="ink" font-size="12" text-anchor="middle">대칭 공유결합</text>
  <text x="80" y="186" class="muted" font-size="10" text-anchor="middle">전자쌍이 가운데</text>

  <!-- Case 2: polar covalent -->
  <ellipse cx="240" cy="120" rx="42" ry="26" class="cloud" transform="translate(6,0)"/>
  <circle cx="222" cy="120" r="14" class="atomA" stroke-width="1.6"/>
  <circle cx="258" cy="120" r="14" class="atomB" stroke-width="1.6"/>
  <text x="240" y="170" class="ink" font-size="12" text-anchor="middle">극성 공유결합</text>
  <text x="240" y="186" class="muted" font-size="10" text-anchor="middle">전자쌍이 한쪽으로 치우침</text>
  <text x="252" y="100" class="acc" font-size="12" font-weight="700">δ−</text>
  <text x="210" y="100" class="muted" font-size="12" font-weight="700">δ+</text>

  <!-- Case 3: ionic -->
  <circle cx="380" cy="120" r="12" class="atomA" stroke-width="1.6"/>
  <circle cx="420" cy="120" r="17" class="atomB" stroke-width="1.6"/>
  <text x="380" y="100" class="muted" font-size="12" font-weight="700">+</text>
  <text x="420" y="100" class="acc" font-size="12" font-weight="700">−</text>
  <text x="400" y="170" class="ink" font-size="12" text-anchor="middle">이온결합</text>
  <text x="400" y="186" class="muted" font-size="10" text-anchor="middle">전자가 완전히 이동</text>

  <path d="M30,220 L450,220" class="axis" stroke-width="1"/>
  <path d="M440,214 L450,220 L440,226" class="axis" stroke-width="1" fill="none"/>
</svg>
