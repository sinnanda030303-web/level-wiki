<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 285" role="img" aria-label="나카야 다이어그램. 가로축은 성장 온도(0도에서 영하 30도), 세로축은 과포화도. 온도 구간에 따라 판, 바늘과 기둥, 판과 수지상, 다시 기둥으로 형태가 갈린다. 과포화도가 높을수록 가지를 치고, 낮으면 매끈한 면을 유지한다.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    .ink { fill: #1c1b19; }
    .muted { fill: #6b6862; }
    .axis { stroke: #c9c5bd; }
    .div { stroke: #c9c5bd; }
    .wcurve { stroke: #3c7fb1; fill: none; }
    .z1 { fill: #3c7fb1; opacity: 0.10; }
    .z2 { fill: #b4531f; opacity: 0.10; }
    .acc { fill: #b4531f; }
    .blue { fill: #3c7fb1; }
    .shape { stroke: #1c1b19; fill: none; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eceaf0; }
      .muted { fill: #a3a0aa; }
      .axis { stroke: #4a4852; }
      .div { stroke: #4a4852; }
      .wcurve { stroke: #7fb4dd; }
      .z1 { fill: #7fb4dd; opacity: 0.12; }
      .z2 { fill: #e8925c; opacity: 0.12; }
      .acc { fill: #e8925c; }
      .blue { fill: #7fb4dd; }
      .shape { stroke: #eceaf0; }
    }
  </style>

  <!-- 구간 배경 -->
  <rect x="70" y="35" width="49" height="180" class="z1"/>
  <rect x="193" y="35" width="148" height="180" class="z1"/>
  <rect x="119" y="35" width="74" height="180" class="z2"/>
  <rect x="341" y="35" width="99" height="180" class="z2"/>

  <!-- 축 -->
  <line x1="70" y1="35" x2="70" y2="215" class="axis" stroke-width="1"/>
  <line x1="70" y1="215" x2="450" y2="215" class="axis" stroke-width="1"/>

  <!-- 구분선 -->
  <line x1="119" y1="35" x2="119" y2="215" class="div" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="193" y1="35" x2="193" y2="215" class="div" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="341" y1="35" x2="341" y2="215" class="div" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- 물 포화 곡선 -->
  <polyline class="wcurve" stroke-width="2" points="70,215 132,185 193,149 218,113 255,119 317,137 378,161 440,179"/>
  <text x="300" y="132" class="blue" font-size="10">물 포화선 (구름 속 상한)</text>

  <!-- 눈금 -->
  <g class="muted" font-size="10" text-anchor="middle">
    <text x="70" y="230">0</text>
    <text x="132" y="230">−5</text>
    <text x="193" y="230">−10</text>
    <text x="255" y="230">−15</text>
    <text x="317" y="230">−20</text>
    <text x="378" y="230">−25</text>
    <text x="440" y="230">−30 °C</text>
  </g>
  <text x="255" y="248" class="ink" font-size="11" font-weight="700" text-anchor="middle">성장할 때의 온도</text>
  <text x="24" y="128" class="ink" font-size="11" font-weight="700">과포화도</text>
  <text x="30" y="145" class="muted" font-size="9">높음 ↑</text>

  <!-- 모양 아이콘 : 판 -->
  <polygon class="shape" stroke-width="1.4" points="94,178 102,183 102,193 94,198 86,193 86,183"/>
  <text x="94" y="211" class="ink" font-size="10" font-weight="700" text-anchor="middle">판</text>

  <!-- 바늘 / 기둥 -->
  <line x1="146" y1="176" x2="170" y2="190" class="shape" stroke-width="2"/>
  <line x1="142" y1="192" x2="168" y2="200" class="shape" stroke-width="2"/>
  <text x="156" y="213" class="ink" font-size="10" font-weight="700" text-anchor="middle">바늘 · 기둥</text>

  <!-- 판 (저과포화) -->
  <polygon class="shape" stroke-width="1.4" points="255,176 263,181 263,191 255,196 247,191 247,181"/>
  <text x="255" y="211" class="ink" font-size="10" font-weight="700" text-anchor="middle">판</text>

  <!-- 수지상 (고과포화) -->
  <g class="shape" stroke-width="1.4">
    <line x1="255" y1="52" x2="255" y2="92"/>
    <line x1="238" y1="62" x2="272" y2="82"/>
    <line x1="238" y1="82" x2="272" y2="62"/>
    <line x1="255" y1="62" x2="248" y2="57"/><line x1="255" y1="62" x2="262" y2="57"/>
    <line x1="255" y1="82" x2="248" y2="87"/><line x1="255" y1="82" x2="262" y2="87"/>
    <line x1="245" y1="67" x2="240" y2="60"/><line x1="265" y1="77" x2="270" y2="84"/>
    <line x1="245" y1="77" x2="240" y2="84"/><line x1="265" y1="67" x2="270" y2="60"/>
  </g>
  <text x="255" y="106" class="acc" font-size="10" font-weight="700" text-anchor="middle">수지상 (별 모양)</text>

  <!-- 기둥 (저온) -->
  <rect x="380" y="176" width="26" height="14" class="shape" stroke-width="1.4"/>
  <text x="393" y="211" class="ink" font-size="10" font-weight="700" text-anchor="middle">기둥 · 두꺼운 판</text>

  <text x="255" y="24" class="muted" font-size="10" text-anchor="middle">온도가 몇 도만 달라져도 판과 기둥이 뒤바뀐다 — 그 이유는 아직 정리되지 않았다</text>
  <text x="255" y="268" class="muted" font-size="10" text-anchor="middle">가로축은 &lt;형태를 정하는 변수&gt;, 세로축은 &lt;가지를 얼마나 치는지&gt;를 정한다</text>
</svg>
