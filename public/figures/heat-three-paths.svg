<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 190" role="img" aria-label="열이 옮겨가는 세 가지 길. 전도는 접촉을 통해, 대류는 유체의 이동으로, 복사는 전자기파로 전달된다.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    .ink { fill: #1c1b19; }
    .muted { fill: #6b6862; }
    .box { stroke: #c9c5bd; fill: none; }
    .hot { fill: #b4531f; }
    .cool { fill: #3c7fb1; }
    .hotS { stroke: #b4531f; fill: none; }
    .coolS { stroke: #3c7fb1; fill: none; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eceaf0; }
      .muted { fill: #a3a0aa; }
      .box { stroke: #4a4852; }
      .hot { fill: #e8925c; }
      .cool { fill: #7fb4dd; }
      .hotS { stroke: #e8925c; }
      .coolS { stroke: #7fb4dd; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>

  <!-- 전도 -->
  <rect x="20" y="30" width="150" height="100" rx="8" class="box"/>
  <rect x="42" y="62" width="50" height="38" class="hot" opacity="0.75"/>
  <rect x="98" y="62" width="50" height="38" class="cool" opacity="0.6"/>
  <path d="M74,81 L118,81" class="hotS" stroke-width="2" marker-end="url(#ah)"/>
  <text x="95" y="150" class="ink" font-size="13" font-weight="700" text-anchor="middle">전도</text>
  <text x="95" y="168" class="muted" font-size="11" text-anchor="middle">맞닿아 진동을 넘긴다</text>

  <!-- 대류 -->
  <rect x="195" y="30" width="150" height="100" rx="8" class="box"/>
  <path d="M225,110 L225,58 M225,58 L315,58 M315,58 L315,110" class="box" stroke-width="2"/>
  <path d="M248,100 C240,74 262,70 258,92" class="hotS" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M292,72 C300,98 278,102 282,80" class="coolS" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M232,112 L308,112" class="hotS" stroke-width="3" opacity="0.6"/>
  <text x="270" y="150" class="ink" font-size="13" font-weight="700" text-anchor="middle">대류</text>
  <text x="270" y="168" class="muted" font-size="11" text-anchor="middle">데워진 유체가 직접 돈다</text>

  <!-- 복사 -->
  <rect x="370" y="30" width="150" height="100" rx="8" class="box"/>
  <circle cx="403" cy="80" r="18" class="hot" opacity="0.8"/>
  <path d="M428,66 q10,-7 20,0 t20,0" class="hotS" stroke-width="1.8"/>
  <path d="M428,80 q10,-7 20,0 t20,0" class="hotS" stroke-width="1.8"/>
  <path d="M428,94 q10,-7 20,0 t20,0" class="hotS" stroke-width="1.8"/>
  <rect x="478" y="62" width="24" height="38" class="cool" opacity="0.6"/>
  <text x="445" y="150" class="ink" font-size="13" font-weight="700" text-anchor="middle">복사</text>
  <text x="445" y="168" class="muted" font-size="11" text-anchor="middle">진공도 건넌다</text>
</svg>
